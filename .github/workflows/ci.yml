name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/testdb
      NODE_ENV: test
      PORT: 3000
      FIREBASE_PROJECT_ID: test-project-id
      FIREBASE_CLIENT_EMAIL: test@test.iam.gserviceaccount.com
      FIREBASE_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\nMIIEvgIBADANBgkqhkiG9w0BAQEFAASCBKgwggSkAgEAAoIBAQC3\n-----END PRIVATE KEY-----"
      FIREBASE_API_KEY: test-api-key
      PINO_LOG_LEVEL: fatal
      TRACE_ID_HEADER: x-trace-id
      CORS_ORIGIN: http://localhost:8081
      BASE_URL: http://localhost:3000
      STRICT_VERSION_CHECK: 'false'
      RATE_LIMIT_MAX: 100
      RATE_LIMIT_WINDOW_MS: 900000
      AUTOCOMPLETE_RATE_LIMIT: 200
      KEEP_ALIVE_IDLE_THRESHOLD_MS: 1200000
      ADMIN_API_KEY: test-admin-api-key

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm run prisma:generate

      - name: Run Prisma Migrations
        run: pnpm run prisma:migrate

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run tsc

      - name: Run automated test suite
        run: pnpm test
