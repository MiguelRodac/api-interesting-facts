  /reposts/{repostId}:
    get:
      summary: Get repost detail with original fact content
      operationId: getRepostById
      tags:
        - Reposts
      parameters:
        - name: X-App-Version
          in: header
          required: true
          description: Client app version (semver). Requests without it are rejected with 400; outdated versions get 426.
          example: 1.2.0
          schema:
            type: string
            pattern: ^\d+\.\d+\.\d+$
        - schema:
            type: string
            format: uuid
          required: true
          name: repostId
          in: path
      responses:
        '200':
          description: Repost detail with original fact content, engagement, and viewer context
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Repost UUID — use for like/comment on the repost
                  factId:
                    type: string
                    format: uuid
                    description: Original fact UUID — use for reposting the original fact
                  author:
                    type: object
                    properties:
                      id:
                        type: string
                      username:
                        type: string
                      email:
                        type: string
                        format: email
                      displayName:
                        type: string
                      avatarUrl:
                        type: string
                        nullable: true
                      avatarColor:
                        type: string
                        nullable: true
                    required:
                      - id
                      - username
                      - email
                      - displayName
                      - avatarUrl
                      - avatarColor
                    description: Author of the original fact
                  title:
                    type: string
                    nullable: true
                    description: Title of the original fact
                  content:
                    type: string
                    description: Content of the original fact
                  hashtags:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        tag:
                          type: string
                      required:
                        - id
                        - tag
                  repostCount:
                    type: integer
                    description: Total reposts of the original fact
                  repostedBy:
                    type: object
                    properties:
                      username:
                        type: string
                      displayName:
                        type: string
                      avatarUrl:
                        type: string
                        nullable: true
                      avatarColor:
                        type: string
                        nullable: true
                      isMe:
                        type: boolean
                    required:
                      - username
                      - displayName
                      - avatarUrl
                      - avatarColor
                      - isMe
                    description: Who reposted this
                  repostLikeCount:
                    type: integer
                    description: Likes ON this repost
                  liked:
                    type: boolean
                    description: Did the authenticated user like this repost?
                  likeBy:
                    type: array
                    items:
                      type: object
                      properties:
                        username:
                          type: string
                        avatarUrl:
                          type: string
                          nullable: true
                        avatarColor:
                          type: string
                          nullable: true
                      required:
                        - username
                        - avatarUrl
                        - avatarColor
                    maxItems: 3
                    description: Recent users who liked this repost
                  repostCommentCount:
                    type: integer
                    description: Comments ON this repost
                  repostCommentsDetails:
                    type: object
                    nullable: true
                    properties:
                      id:
                        type: string
                        format: uuid
                      content:
                        type: string
                      author:
                        type: object
                        properties:
                          username:
                            type: string
                          avatarUrl:
                            type: string
                            nullable: true
                          avatarColor:
                            type: string
                            nullable: true
                        required:
                          - username
                          - avatarUrl
                          - avatarColor
                      parentCommentId:
                        type: string
                        nullable: true
                        format: uuid
                      replies:
                        type: integer
                      createdAt:
                        type: string
                        format: date-time
                    required:
                      - id
                      - content
                      - author
                      - parentCommentId
                      - replies
                      - createdAt
                    description: First comment on this repost
                  createdAt:
                    type: string
                    format: date-time
                    description: When the repost was created
                required:
                  - id
                  - factId
                  - author
                  - title
                  - content
                  - hashtags
                  - repostCount
                  - repostedBy
                  - repostLikeCount
                  - likeBy
                  - repostCommentCount
                  - repostCommentsDetails
                  - createdAt
