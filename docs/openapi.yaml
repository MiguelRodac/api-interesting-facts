  /facts/search:
    get:
      summary: Global search (users, facts, reposts, hashtags)
      operationId: globalSearch
      tags:
        - Facts
      security:
        - bearerAuth: []
      description: >-
        Search across users, posts, and hashtags in a single request.


        Response shape depends on the query prefix:

        - `@mention` queries: returns users matching the mention AND `results` with FeedEntry[] (facts + reposts, fully
        enriched).

        - Plain text queries: same as mentions — merged results in `results` as FeedEntry[].

        - `#hashtag` queries: returns hashtags plus legacy `facts` array (FactResponse[], no reposts).
      parameters:
        - name: X-App-Version
          in: header
          required: true
          description: Client app version (semver). Requests without it are rejected with 400; outdated versions get 426.
          example: 1.2.0
          schema:
            type: string
            pattern: ^\d+\.\d+\.\d+$
        - schema:
            type: string
            minLength: 1
            maxLength: 50
          required: true
          name: q
          in: query
        - schema:
            type: string
            enum:
              - recent
              - popular
          required: false
          name: order_by
          in: query
        - schema:
            type: string
            enum:
              - asc
              - desc
          required: false
          name: order_dir
          in: query
        - schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
            default: 1
          required: false
          name: page
          in: query
        - schema:
