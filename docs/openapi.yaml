      operationId: getRepostCommentLikes
      tags:
        - Comment Likes
      security:
        - bearerAuth: []
      parameters:
        - name: X-App-Version
          in: header
          required: true
          description: Client app version (semver). Requests without it are rejected with 400; outdated versions get 426.
          example: 1.2.0
