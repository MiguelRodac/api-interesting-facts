    CreateProfileRequest:
      type: object
      properties:
        username:
          type: string
          pattern: ^[a-zA-Z0-9_.]{3,30}$
        displayName:
          type: string
          minLength: 1
          maxLength: 50
        avatarUrl:
          type: string
          format: uri
      required:
        - username
        - displayName
    DevLoginRequest:
      type: object
      properties:
        secret:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
      required:
        - secret
        - email
        - password
    DevLoginResponse:
      type: object
      properties:
        token:
          type: string
      required:
