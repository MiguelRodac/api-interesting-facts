          required: false
          name: factId
          in: path
        - schema:
            type: string
            format: uuid
          required: false
          name: repostId
          in: path
        - schema:
            type: string
            format: uuid
          required: true
          name: commentId
          in: path
        - schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
            default: 1
          required: false
          name: page
          in: query
        - schema:
