openapi: 3.0.3
info:
  title: Social Facts API
  description: API for social facts with Firebase Auth, PostgreSQL + Prisma
  version: 0.0.1
  contact:
    name: API Support
servers:
  - url: http://localhost:3000
    description: Local development
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Firebase JWT token
  schemas:
    ErrorResponse:
      type: object
      properties:
        type:
          type: string
          description: URI reference that identifies the problem type
        title:
          type: string
          description: Short, human-readable summary of the problem
        status:
          type: integer
          description: HTTP status code
        detail:
          type: string
          description: Human-readable explanation specific to this error occurrence
        instance:
          type: string
          description: URI reference of the request that caused the error
        trace_id:
          type: string
          format: uuid
          description: Unique trace ID for request tracking
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the error occurred
        error_code:
          type: string
          description: Machine-readable error code (e.g. VALIDATION_ERROR, USER_NOT_FOUND)
        category:
          type: string
          description: 'Error category: validation, not_found, forbidden, conflict, infra, unknown'
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                description: Field name that caused the error
              message:
                type: string
                description: Human-readable error message for this field
            required:
              - field
              - message
          description: Array of field-level validation errors
      required:
        - type
        - title
        - status
        - detail
        - instance
        - trace_id
        - timestamp
        - error_code
        - category
    ValidationError:
      type: object
      properties:
        type:
          type: string
          description: URI reference that identifies the problem type
