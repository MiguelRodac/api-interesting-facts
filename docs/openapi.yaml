        - users
        - facts
        - hashtags
        - page
        - limit
        - hasMore
    PingResponse:
      type: object
      properties:
        status:
          type: string
        timestamp:
          type: string
          format: date-time
        uptimeSeconds:
          type: integer
        database:
          type: string
          enum:
            - ok
            - error
        documentation:
          type: string
          format: uri
      required:
        - status
        - timestamp
        - uptimeSeconds
        - database
        - documentation
  parameters: {}
paths:
  /ping:
    get:
      summary: Health check
      operationId: ping
      tags:
        - Health
      description: Returns server status with database health check.
      responses:
        '200':
          description: Server is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
                  uptimeSeconds:
                    type: integer
                  database:
                    type: string
                    enum:
                      - ok
                      - error
                  documentation:
                    type: string
                    format: uri
                required:
                  - status
                  - timestamp
                  - uptimeSeconds
                  - database
                  - documentation
            text/html:
              schema:
                type: string
  /auth/profile:
    post:
      summary: Create user profile (onboarding)
      operationId: createProfile
      tags:
        - Auth
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  pattern: ^[a-zA-Z0-9_.]{3,30}$
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 50
                avatarUrl:
                  type: string
                  format: uri
              required:
                - username
                - displayName
      responses:
        '201':
          description: Profile created
          content:
            application/json:
              schema:
                type: object
                properties:
                  firebaseUid:
                    type: string
                  email:
                    type: string
                    format: email
                  username:
                    type: string
                  displayName:
                    type: string
                  avatarUrl:
                    type: string
                    nullable: true
                  avatarColor:
                    type: string
                    nullable: true
                  createdAt:
                    type: string
