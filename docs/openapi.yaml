paths:
  /ping:
    get:
      summary: Health check
      operationId: ping
      tags:
        - Health
      description: Returns server status with database health check.
      responses:
        '200':
          description: Server is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
                  uptimeSeconds:
                    type: integer
                  database:
                    type: string
                    enum:
                      - ok
                      - error
                  documentation:
                    type: string
                    format: uri
                required:
                  - status
                  - timestamp
                  - uptimeSeconds
                  - database
                  - documentation
            text/html:
              schema:
                type: string
  /ping/version-info:
    get:
      summary: View cached app versions (Admin)
      operationId: pingVersionInfo
      tags:
        - Health
        - Admin
      description: Returns current in-memory cached app version rules. Requires admin key authorization.
      parameters:
        - name: x-admin-key
          in: header
          required: true
          description: Admin authorization key
          schema:
            type: string
      responses:
        '200':
          description: Cached app versions status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  cache:
                    type: object
                    properties:
                      source:
                        type: string
                      ttlHours:
                        type: integer
                      lastRefreshed:
                        type: string
                        nullable: true
                        format: date-time
                      versions:
                        type: array
                        items:
                          type: object
                          properties:
                            platform:
                              type: string
                            minVersion:
                              type: string
                            recommendedVersion:
                              type: string
                              nullable: true
                            forceUpdate:
                              type: boolean
                          required:
                            - platform
                            - minVersion
                            - forceUpdate
                    required:
                      - source
                      - ttlHours
                      - lastRefreshed
                      - versions
                required:
                  - status
                  - cache
        '401':
          description: Missing or invalid authentication token
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    description: URI reference that identifies the problem type
                  title:
                    type: string
                    description: Short, human-readable summary of the problem
                  status:
                    type: integer
                    description: HTTP status code
                  detail:
                    type: string
                    description: Human-readable explanation specific to this error occurrence
                  instance:
                    type: string
                    description: URI reference of the request that caused the error
                  trace_id:
                    type: string
                    format: uuid
                    description: Unique trace ID for request tracking
                  timestamp:
                    type: string
                    format: date-time
                    description: ISO 8601 timestamp when the error occurred
                  error_code:
                    type: string
                    enum:
                      - UNAUTHORIZED
                    description: Machine-readable error code
                  category:
                    type: string
                    enum:
                      - authentication
                    description: Error category
                required:
                  - type
                  - title
                  - status
                  - detail
                  - instance
                  - trace_id
                  - timestamp
                  - error_code
                  - category
  /ping/refresh-versions:
    post:
      summary: Refresh cached app versions from DB (Admin)
      operationId: pingRefreshVersions
      tags:
        - Health
        - Admin
      description: >-
        Forces immediate reload of app version rules from PostgreSQL into memory cache. Requires admin key
        authorization.
      parameters:
